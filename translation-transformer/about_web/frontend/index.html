<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英翻译</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease;
        }
        .translate-container {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            margin: 0 1px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            } 40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="translate-container p-8 max-w-2xl w-full mx-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">中英翻译</h1>
        
        <div class="mb-6">
            <label for="chinese-input" class="block text-sm font-medium text-gray-700 mb-1">中文输入</label>
            <textarea id="chinese-input" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入中文..."></textarea>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">英文翻译</label>
            <div id="english-output" class="w-full px-4 py-4 border border-gray-300 rounded-lg bg-gray-50 min-h-[100px]">
                <div class="text-gray-400">翻译结果将显示在这里</div>
            </div>
        </div>
        
        <div class="flex justify-center">
            <button id="translate-btn" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
                翻译
            </button>
        </div>
    </div>

    <script>
        // 背景图片列表
        const backgroundImages = [
            '1.webp', '2.webp', '3.webp', '4.webp', '5.webp',
            '6.webp', '7.webp', '8.webp', '9.webp', '10.webp',
            '11.webp', '12.webp'
        ];
        
        // 随机选择背景图片
        function setRandomBackground() {
            const randomIndex = Math.floor(Math.random() * backgroundImages.length);
            const imagePath = `/image/${backgroundImages[randomIndex]}`;
            document.body.style.backgroundImage = `url('${imagePath}')`;
        }
        
        // 初始化背景
        setRandomBackground();
        
        // 翻译功能
        document.getElementById('translate-btn').addEventListener('click', async function() {
            const inputText = document.getElementById('chinese-input').value.trim();
            const outputDiv = document.getElementById('english-output');
            
            if (!inputText) {
                outputDiv.innerHTML = '<div class="text-red-500">请输入中文内容</div>';
                return;
            }
            
            // 显示加载动画
            outputDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            
            try {
                const response = await axios.post('/translate', {
                    text: inputText
                });
                
                outputDiv.innerHTML = `<div class="text-gray-800">${response.data.translation}</div>`;
            } catch (error) {
                outputDiv.innerHTML = `<div class="text-red-500">翻译失败: ${error.message}</div>`;
            }
        });
        
        // 按Enter键触发翻译
        document.getElementById('chinese-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.shiftKey) {
                // 按住Shift+Enter换行
                return;
            } else if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('translate-btn').click();
            }
        });
    </script>
</body>
</html>
